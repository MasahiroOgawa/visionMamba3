[project]
name = "visionmamba3"
version = "0.1.0"
description = "Mamba-3 SSD attention modules — pure, reusable Vision Mamba library"
authors = [{ name = "Masahiro Ogawa", email = "masahiro.ogaw@gmail.com" }]
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.2",
    "einops",
    "numpy<2",
    "huggingface-hub>=1.22.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-xdist"]
eval = [
    "matplotlib>=3.11.1",
    "pyyaml>=6.0.3",
    "torchvision>=0.27.1",
]
depth = [
    "addict>=2.4.0",
    "evo>=1.37.0",
    "imageio>=2.37.4",
    "omegaconf>=2.3.1",
    "opencv-python-headless>=4.11.0.86",
    "safetensors>=0.8.0",
    "timm>=1.0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/visionmamba3", "src/eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.15.14",
]
