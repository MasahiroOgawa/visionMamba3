    { name = "huggingface-hub" },
    { name = "numpy" },
    { name = "torch" },
]

[package.optional-dependencies]
dev = [
    { name = "pytest" },
    { name = "pytest-xdist" },
]
eval = [
    { name = "pyyaml" },
    { name = "torchvision" },
]

[package.dev-dependencies]
dev = [
    { name = "pytest" },
    { name = "pytest-xdist" },
    { name = "ruff" },
]

[package.metadata]
requires-dist = [
    { name = "einops" },
    { name = "huggingface-hub", specifier = ">=1.22.0" },
    { name = "numpy", specifier = "<2" },
    { name = "pytest", marker = "extra == 'dev'", specifier = ">=7" },
    { name = "pytest-xdist", marker = "extra == 'dev'" },
    { name = "pyyaml", marker = "extra == 'eval'", specifier = ">=6.0.3" },
    { name = "torch", specifier = ">=2.2" },
    { name = "torchvision", marker = "extra == 'eval'", specifier = ">=0.27.1" },
]
provides-extras = ["dev", "eval"]

[package.metadata.requires-dev]
dev = [
    { name = "pytest", specifier = ">=9.1.1" },
    { name = "pytest-xdist", specifier = ">=3.8.0" },
    { name = "ruff", specifier = ">=0.15.14" },
]
